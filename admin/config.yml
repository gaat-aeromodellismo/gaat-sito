# CONFIGURAZIONE INIZIALE: sostituire NOME_ACCOUNT/NOME_REPOSITORY
# e configurare il servizio OAuth GitHub prima dell'accesso al CMS.

backend:
  name: github
  repo: gaat-aeromodellismo/gaat-sito
  branch: main
  base_url: https://gaat-cms-oauth.alessandro-delbene.workers.dev
  auth_endpoint: auth
media_folder: assets/uploads
public_folder: /assets/uploads
locale: it
collections:
  - name: news
    label: Notizie
    files:
      - name: news
        label: Elenco notizie
        file: content/news.json
        fields:
          - label: Notizie
            name: items
            widget: list
            fields:
              - {label: Titolo, name: title, widget: string}
              - {label: Data, name: date, widget: datetime, date_format: YYYY-MM-DD, time_format: false, format: YYYY-MM-DD}
              - {label: Descrizione, name: description, widget: text}
  - name: events
    label: Eventi
    files:
      - name: events
        label: Elenco eventi
        file: content/events.json
        fields:
          - label: Eventi
            name: items
            widget: list
            fields:
              - {label: Titolo, name: title, widget: string}
              - {label: Data, name: date, widget: datetime, date_format: YYYY-MM-DD, time_format: false, format: YYYY-MM-DD}
              - {label: Descrizione, name: description, widget: text}

  - name: marketplace
    label: Mercatino
    files:
      - name: marketplace
        label: Elenco annunci
        file: content/marketplace.json
        fields:
          - label: Annunci
            name: items
            widget: list
            summary: "{{fields.title}}"
            fields:
              - {label: Titolo, name: title, widget: string}
              - {label: Categoria, name: category, widget: select, options: [Aeromodelli, Motori, Radiocomandi, Elettronica, Accessori, Altro]}
              - {label: Prezzo EUR, name: price, widget: number, value_type: float, min: 0}
              - {label: Descrizione, name: description, widget: text}
              - {label: Fotografia principale, name: image, widget: image, required: false}
              - label: Altre fotografie
                name: images
                widget: list
                required: false
                field: {label: Fotografia, name: image, widget: image}
              - {label: Venditore, name: seller, widget: string}
              - {label: Contatto, name: contact, widget: string}
              - {label: Stato, name: status, widget: select, options: [Disponibile, Riservato, Venduto], default: Disponibile}
